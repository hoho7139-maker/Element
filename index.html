<body>
<header><div><div class="eyebrow">FAMILY LEARNING · 108 CURRICULUM</div><h1>家庭智慧學習中心</h1><div class="muted">陪孩子每天練一點，讓學習看得見。</div></div></header>
<main>
<nav class="tabs noprint"><button class="active" data-tab="learn">開始練習</button><button data-tab="wrong">錯題本</button><button data-tab="progress">學習紀錄</button><button data-tab="family">孩子管理</button></nav>
<section id="learn">
<div class="card noprint"><div class="row">
<div><label>學習者</label><select id="kid"></select></div>
<div><label>學習階段</label><select id="grade"><option value="幼兒預備">幼兒預備</option><option value="小一預備">小一預備</option><option value="1">國小一年級</option><option value="2">國小二年級</option><option value="3">國小三年級</option><option value="4">國小四年級</option><option value="5">國小五年級</option><option value="6">國小六年級</option></select></div>
<div><label>科目</label><select id="subject"></select></div></div></div>
<div class="card"><div class="row"><span class="pill" id="meta">準備開始</span><span class="muted" id="count" style="margin-left:auto"></span></div><div class="q" id="question">選擇學習階段與科目後開始練習。</div><div id="choices"></div>
<div class="actions noprint"><button class="btn" id="hint">看提示</button><button class="btn primary" id="check">送出答案</button><button class="btn hidden" id="next">下一題</button></div><div id="feedback" class="feedback hidden"></div></div>
<div class="card noprint"><h2>列印練習單</h2><p class="notice">列印目前科目的樣題，答案與解析會另外列在後面。</p><button class="btn" id="print">列印題本＋解析</button></div>
</section>
<section id="wrong" class="hidden"><div class="card"><h2>錯題本</h2><div id="wrongItems" class="muted">目前還沒有錯題。</div></div></section>
<section id="progress" class="hidden"><div class="card"><h2>學習紀錄</h2><div class="stats"><div class="stat"><b id="done">0</b><small>作答次數</small></div><div class="stat"><b id="rate">0%</b><small>答對率</small></div><div class="stat"><b id="wrongN">0</b><small>錯題數</small></div></div><div id="bySubject" style="margin-top:12px"></div></div></section>
<section id="family" class="hidden"><div class="card"><h2>孩子管理</h2><div id="kids"></div><div class="row" style="margin-top:13px"><div><label>新增孩子暱稱</label><input id="newName" placeholder="例如：小寶"></div><div style="align-self:end"><button id="add" class="btn primary">新增孩子</button></div></div><p class="notice">學習資料保存在目前裝置的瀏覽器。不同裝置不會自動同步；請勿在公開網站輸入孩子真實姓名等個資。</p></div></section>
</main><footer>家庭智慧學習中心｜六個年級各30題試用題庫</footer>

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function kid(){return data.kids.find(k=>k.id===$("kid").value)||data.kids[0]}
function subjects(g){if(g==="幼兒預備")return["語文","數學"];if(g==="小一預備")return["國語","數學"];if(g==="1"||g==="2")return["國語","數學","生活","健康與體育","藝術","綜合活動"];return["國語","數學","英語","自然","社會","健康與體育","藝術","綜合活動"]}
function fillSubjects(){let s=subjects($("grade").value);$("subject").innerHTML=s.map(x=>'<option>'+x+'</option>').join("");loadQ()}
function listQ(){return bank.filter(q=>q.g===$("grade").value&&q.s===$("subject").value)}
function loadQ(next=false){let arr=listQ();if(!arr.length)questionIndex=0;else if(next)questionIndex=(questionIndex+1)%arr.length;else questionIndex=0;current=arr[questionIndex]||null;answered=false;$("feedback").className="feedback hidden";$("next").classList.add("hidden");$("check").classList.remove("hidden");$("meta").textContent=current?current.g+" · "+current.s:"題庫建置中";$("count").textContent=arr.length?"第 "+(questionIndex+1)+" / "+arr.length+" 題 · "+current.level:"";$("question").textContent=current?current.q:"這個科目的樣題正在編製中。";$("choices").innerHTML=current?current.o.map((v,i)=>'<label class="choice"><input type="radio" name="ans" value="'+i+'"><span>'+esc(v)+'</span></label>').join(""):""}
function answer(){if(!current||answered)return;let el=document.querySelector('input[name=ans]:checked');if(!el)return alert("請先選擇答案");let n=+el.value,ok=n===current.a,c=kid();answered=true;let r={kid:c.id,subject:current.s,q:current.q,choice:n,answer:current.a,correct:ok,explain:current.e,options:current.o,why:current.x[n]};data.records.push(r);if(!ok)data.wrong.push(r);save();$("feedback").className="feedback"+(ok?"":" bad");$("feedback").innerHTML=(ok?"<b>答對了！</b>":"<b>再想一想，這題答錯了。</b>")+"<br>正確答案："+esc(current.o[current.a])+"<br><b>觀念解析：</b>"+esc(current.e)+"<br><b>你的選項：</b>"+esc(current.x[n])+"<br><b>延伸練習：</b>請用自己的話說明這個觀念，並舉一個生活例子。";$("check").classList.add("hidden");$("next").classList.remove("hidden");document.querySelectorAll('input[name=ans]').forEach(x=>x.disabled=true)}
function stats(){let a=data.records.filter(r=>r.kid===$("kid").value),ok=a.filter(r=>r.correct).length;$("done").textContent=a.length;$("rate").textContent=a.length?Math.round(ok/a.length*100)+"%":"0%";$("wrongN").textContent=data.wrong.filter(r=>r.kid===$("kid").value).length;let m={};a.forEach(r=>{m[r.subject]??={n:0,c:0};m[r.subject].n++;if(r.correct)m[r.subject].c++});$("bySubject").innerHTML=Object.entries(m).map(([s,v])=>'<p>'+esc(s)+'：'+v.c+'/'+v.n+' 題答對（'+Math.round(v.c/v.n*100)+'%）</p>').join("")||'<p class="muted">完成練習後會顯示各科統計。</p>'}
function wrongList(){let a=data.wrong.filter(r=>r.kid===$("kid").value);$("wrongItems").innerHTML=a.length?a.slice().reverse().map(r=>'<div class="card"><b>'+esc(r.subject)+'｜'+esc(r.q)+'</b><p class="muted">你的答案：'+esc(r.options[r.choice])+'；正確答案：'+esc(r.options[r.answer])+'</p><p>'+esc(r.explain)+'</p></div>').join(""):"目前還沒有錯題。"}
function renderKids(){$("kid").innerHTML=data.kids.map(k=>'<option value="'+k.id+'">'+esc(k.name)+'</option>').join("");$("kids").innerHTML=data.kids.map(k=>'<div class="child"><span>'+esc(k.name)+'</span><button class="btn" onclick="renameKid(\''+k.id+'\')">改名</button><button class="btn danger" onclick="deleteKid(\''+k.id+'\')">刪除</button></div>').join("")}
function renameKid(id){let k=data.kids.find(x=>x.id===id),v=prompt("孩子暱稱",k.name);if(v&&v.trim()){k.name=v.trim();renderKids();save()}}
function deleteKid(id){if(data.kids.length<2)return alert("至少保留一位孩子");if(!confirm("刪除孩子及其學習紀錄？"))return;data.kids=data.kids.filter(k=>k.id!==id);data.records=data.records.filter(r=>r.kid!==id);data.wrong=data.wrong.filter(r=>r.kid!==id);renderKids();$("grade").value=kid().grade;fillSubjects();save()}
$("add").onclick=()=>{let n=$("newName").value.trim();if(!n)return alert("請輸入暱稱");data.kids.push({id:"k"+Date.now(),name:n,grade:"小一預備"});$("newName").value="";renderKids();$("kid").value=data.kids[data.kids.length-1].id;stats();wrongList()};
$("kid").onchange=()=>{$("grade").value=kid().grade||"小一預備";fillSubjects();stats();wrongList()};
$("grade").onchange=()=>{kid().grade=$("grade").value;save();fillSubjects()};
$("subject").onchange=loadQ;$("check").onclick=answer;$("next").onclick=()=>loadQ(true);$("hint").onclick=()=>current&&alert("提示："+current.h);
$("print").onclick=()=>{let a=listQ();if(!a.length)return alert("目前沒有可列印的樣題");let w=window.open("","_blank");if(!w)return alert("請允許開啟列印視窗");w.document.write('<html lang="zh-Hant"><meta charset="utf-8"><title>練習題本</title><style>body{font-family:sans-serif;padding:28px;line-height:1.7}.q{margin:22px 0;break-inside:avoid}.answers{page-break-before:always}</style><h1>家庭智慧學習中心｜'+esc($("subject").value)+'練習題</h1><p>姓名：__________ 日期：__________</p>'+a.map((q,i)=>'<div class="q"><b>'+(i+1)+'. '+esc(q.q)+'</b><ol type="A">'+q.o.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol></div>').join("")+'<div class="answers"><h1>答案與解析</h1>'+a.map((q,i)=>'<div class="q"><b>'+(i+1)+'. '+esc(q.o[q.a])+'</b><p>'+esc(q.e)+'</p><p>提示：'+esc(q.h)+'</p></div>').join("")+'</div></html>');w.document.close();w.focus();w.print()};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));["learn","wrong","progress","family"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.tab));stats();wrongList();renderKids()});
renderKids();$("grade").value=kid().grade||"小一預備";fillSubjects();stats();wrongList();
</script></body></html>
