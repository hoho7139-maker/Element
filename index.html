<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e9eee7">
<title>家庭智慧學習中心</title>
<style>
:root{--green:#416b58;--ink:#26342e;--muted:#68766e;--bg:#f6f4ee;--line:#e5e1d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
header{background:#e8eee6;padding:24px 18px}header>div,main{max-width:900px;margin:auto}h1{font-size:25px;margin:7px 0}h2{font-size:18px;margin:0 0 12px}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--green);font-weight:700}.muted,.notice{color:var(--muted);font-size:13px;line-height:1.6}
main{padding:18px 15px 45px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.tabs button,.btn{border:0;border-radius:11px;padding:11px 14px;background:#e9e6de;color:var(--ink);font-weight:650;white-space:nowrap}.tabs .active,.primary{background:var(--green)!important;color:white!important}
.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}label{display:block;color:var(--muted);font-size:13px;margin:0 0 5px}select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font:inherit}
.q{font-size:19px;line-height:1.7;margin:15px 0}.choice{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;margin:8px 0}.choice input{width:auto}.feedback{background:#eff4ef;padding:13px;border-radius:12px;line-height:1.7;margin-top:12px}.bad{background:#fbefed}.hidden{display:none!important}.actions{display:flex;gap:8px;margin-top:13px}.actions>*{flex:1}.pill{background:#f1eee6;padding:5px 9px;border-radius:30px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f0f4ef;padding:12px;border-radius:12px}.stat b{font-size:22px;display:block}.child{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0}.child span{flex:1}.danger{background:#faeeeb;color:#a43d36}footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(min-width:650px){main{padding-top:25px}}@media print{header,.tabs,.noprint,footer{display:none!important}body{background:white}.card{border:0;break-inside:avoid}}
</style>
</head>
<body>
<header><div><div class="eyebrow">FAMILY LEARNING · 108 CURRICULUM</div><h1>家庭智慧學習中心</h1><div class="muted">陪孩子每天練一點，讓學習看得見。</div></div></header>
<main>
<nav class="tabs noprint"><button class="active" data-tab="learn">開始練習</button><button data-tab="wrong">錯題本</button><button data-tab="progress">學習紀錄</button><button data-tab="family">孩子管理</button></nav>
<section id="learn">
<div class="card noprint"><div class="row">
<div><label>學習者</label><select id="kid"></select></div>
<div><label>學習階段</label><select id="grade"><option value="幼兒預備">幼兒預備</option><option value="小一預備">小一預備</option><option value="1">國小一年級</option><option value="2">國小二年級</option><option value="3">國小三年級</option><option value="4">國小四年級</option><option value="5">國小五年級</option><option value="6">國小六年級</option></select></div>
<div><label>科目</label><select id="subject"></select></div></div></div>
<div class="card"><div class="row"><span class="pill" id="meta">準備開始</span><span class="muted" id="count" style="margin-left:auto"></span></div><div class="q" id="question">選擇學習階段與科目後開始練習。</div><div id="choices"></div>
<div class="actions noprint"><button class="btn" id="hint">看提示</button><button class="btn primary" id="check">送出答案</button><button class="btn hidden" id="next">下一題</button></div><div id="feedback" class="feedback hidden"></div></div>
<div class="card noprint"><h2>列印練習單</h2><p class="notice">列印目前科目的樣題，答案與解析會另外列在後面。</p><button class="btn" id="print">列印題本＋解析</button></div>
</section>
<section id="wrong" class="hidden"><div class="card"><h2>錯題本</h2><div id="wrongItems" class="muted">目前還沒有錯題。</div></div></section>
<section id="progress" class="hidden"><div class="card"><h2>學習紀錄</h2><div class="stats"><div class="stat"><b id="done">0</b><small>作答次數</small></div><div class="stat"><b id="rate">0%</b><small>答對率</small></div><div class="stat"><b id="wrongN">0</b><small>錯題數</small></div></div><div id="bySubject" style="margin-top:12px"></div></div></section>
<section id="family" class="hidden"><div class="card"><h2>孩子管理</h2><div id="kids"></div><div class="row" style="margin-top:13px"><div><label>新增孩子暱稱</label><input id="newName" placeholder="例如：小寶"></div><div style="align-self:end"><button id="add" class="btn primary">新增孩子</button></div></div><p class="notice">學習資料保存在目前裝置的瀏覽器。不同裝置不會自動同步；請勿在公開網站輸入孩子真實姓名等個資。</p></div></section>
</main><footer>家庭智慧學習中心｜初始樣題版，題庫將分批擴充</footer>
<script>
const bank=[
{g:"幼兒預備",s:"語文",q:"「ㄇㄠ」是哪一個字？",o:["貓","狗","鳥"],a:0,h:"想想看，會喵喵叫的動物。",e:"「ㄇㄠ」的注音對應「貓」。先聽聲音，再連結字形。",x:["正確，貓的注音是ㄇㄠ。","狗讀作ㄍㄡˇ。","鳥讀作ㄋㄧㄠˇ。"]},
{g:"幼兒預備",s:"數學",q:"桌上有 2 顆蘋果，又放上 1 顆，現在共有幾顆？",o:["2 顆","3 顆","4 顆"],a:1,h:"從 2 開始再往後數 1 個。",e:"2＋1＝3。可以用手指或實物逐一點數。",x:["2 顆是還沒加上新蘋果的數量。","正確，2＋1＝3。","4 顆多算了 1 顆。"]},
{g:"小一預備",s:"國語",q:"「ㄅㄚˊ」可能是哪個字？",o:["拔","爸","八"],a:0,h:"想想看，拔河的「拔」。",e:"「拔」讀作ㄅㄚˊ，第二聲；「爸」讀作ㄅㄚˋ；「八」讀作ㄅㄚ。",x:["正確，拔讀作ㄅㄚˊ。","爸是ㄅㄚˋ。","八是ㄅㄚ。"]},
{g:"小一預備",s:"數學",q:"小明有 5 張貼紙，送給同學 2 張，還剩幾張？",o:["2 張","3 張","7 張"],a:1,h:"送出去代表要用減法。",e:"5－2＝3。從 5 張拿走 2 張，剩下 3 張。",x:["2 是送出去的張數。","正確，剩下 3 張。","7 是把 5 和 2 相加。"]},
{g:"1",s:"國語",q:"「明亮」最接近下列哪一個意思？",o:["光線充足","非常吵鬧","十分寒冷"],a:0,h:"想想看，太陽出來時教室變得怎麼樣？",e:"「明亮」形容光線充足、清楚。",x:["正確，明亮指光線充足。","吵鬧是聲音很大。","寒冷是溫度低。"]},
{g:"1",s:"數學",q:"14 可以分成 10 和多少？",o:["2","4","6"],a:1,h:"14 的個位數是多少？",e:"14＝10＋4，所以可以分成 10 和 4。",x:["10＋2＝12。","正確，10＋4＝14。","10＋6＝16。"]},
{g:"2",s:"國語",q:"「因為下雨，所以我們在室內活動。」其中「因為」表示什麼？",o:["原因","結果","時間"],a:0,h:"下雨是造成後面事情的什麼？",e:"「因為」引出原因；「所以」引出結果。",x:["正確，因為後面說明原因。","結果由「所以」帶出。","句子沒有說明時間。"]},
{g:"2",s:"數學",q:"一盒彩色筆有 8 枝，買了 3 盒，共有幾枝？",o:["11 枝","21 枝","24 枝"],a:2,h:"用每盒枝數乘以盒數。",e:"8×3＝24。也就是 8＋8＋8＝24。",x:["11 是 8＋3。","21 不符合 8 的三倍。","正確，8×3＝24。"]},
{g:"3",s:"國語",q:"小安放學後先整理書包，再完成作業，最後才看故事書。小安最後做什麼？",o:["整理書包","完成作業","看故事書"],a:2,h:"找出句子中的「最後」。",e:"順序是整理書包、完成作業、看故事書，因此最後是看故事書。",x:["這是第一件事。","這是第二件事。","正確，最後才看故事書。"]},
{g:"3",s:"數學",q:"2 公尺 35 公分加上 1 公尺 40 公分，合起來多長？",o:["3公尺65公分","3公尺75公分","4公尺15公分"],a:1,h:"公尺和公尺相加，公分和公分相加。",e:"2公尺35公分＋1公尺40公分＝3公尺75公分。",x:["35＋40＝75，不是65。","正確，答案是3公尺75公分。","單位要分開計算。"]},
{g:"4",s:"自然",q:"植物行光合作用時，主要利用哪一種能源？",o:["陽光","聲音","磁力"],a:0,h:"植物通常需要什麼才能生長？",e:"植物利用陽光的能量，將水和二氧化碳製造養分，並釋出氧氣。",x:["正確，陽光提供光合作用所需能量。","聲音不是光合作用能源。","磁力也不是光合作用能源。"]},
{g:"4",s:"數學",q:"長方形長 8 公分、寬 5 公分，周長是多少？",o:["13 公分","26 公分","40 平方公分"],a:1,h:"周長是四邊長度全部加起來。",e:"周長＝(長＋寬)×2＝(8＋5)×2＝26公分。",x:["13是長加寬，少算另一組邊。","正確，周長是26公分。","40是面積，單位也不同。"]},
{g:"5",s:"社會",q:"臺灣位於哪一個海洋的西側？",o:["太平洋","大西洋","北冰洋"],a:0,h:"臺灣東部面向哪個廣大的海洋？",e:"臺灣位於亞洲東部、太平洋西側，東臨太平洋。",x:["正確，臺灣位於太平洋西側。","大西洋位於歐洲、非洲與美洲之間。","北冰洋位於北極周邊。"]},
{g:"5",s:"數學",q:"商品原價 800 元，打八折後售價是多少？",o:["160 元","640 元","720 元"],a:1,h:"八折代表付原價的 80%。",e:"800×0.8＝640元。打八折是折掉兩成，實際支付八成。",x:["160是折扣掉的金額。","正確，售價是640元。","720相當於九折。"]},
{g:"6",s:"自然",q:"地球自轉一圈約需多久？",o:["24 小時","30 天","365 天"],a:0,h:"這個時間和一天的長度有關。",e:"地球自轉一圈約24小時，形成白天與黑夜的週期變化。",x:["正確，約24小時。","約一個月與月球公轉週期相關。","約365天是地球公轉一圈的時間。"]},
{g:"6",s:"數學",q:"水桶裝滿是 12 公升，倒出 25%，還剩多少公升？",o:["3 公升","9 公升","10 公升"],a:1,h:"先算出倒出的四分之一，再從 12 公升扣除。",e:"倒出12×25%＝3公升，剩下12－3＝9公升。",x:["3公升是倒出的水量。","正確，剩下9公升。","10公升不符合四分之一的計算。"]}
];
const $=id=>document.getElementById(id),defaults=[{id:"kid1",name:"大寶",grade:"小一預備"},{id:"kid2",name:"二寶",grade:"幼兒預備"}];
let data=JSON.parse(localStorage.getItem("familyLearning")||"null")||{kids:defaults,records:[],wrong:[]},current=null,answered=false;
function save(){localStorage.setItem("familyLearning",JSON.stringify(data));stats();wrongList()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function kid(){return data.kids.find(k=>k.id===$("kid").value)||data.kids[0]}
function subjects(g){if(g==="幼兒預備")return["語文","數學"];if(g==="小一預備")return["國語","數學"];if(g==="1"||g==="2")return["國語","數學","生活","健康與體育","藝術","綜合活動"];return["國語","數學","英語","自然","社會","健康與體育","藝術","綜合活動"]}
function fillSubjects(){let s=subjects($("grade").value);$("subject").innerHTML=s.map(x=>'<option>'+x+'</option>').join("");loadQ()}
function listQ(){return bank.filter(q=>q.g===$("grade").value&&q.s===$("subject").value)}
function loadQ(){let arr=listQ();current=arr[0]||null;answered=false;$("feedback").className="feedback hidden";$("next").classList.add("hidden");$("check").classList.remove("hidden");$("meta").textContent=current?current.g+" · "+current.s:"題庫建置中";$("count").textContent=arr.length?"目前 "+arr.length+" 題樣題":"";$("question").textContent=current?current.q:"這個科目的樣題正在編製中。";$("choices").innerHTML=current?current.o.map((v,i)=>'<label class="choice"><input type="radio" name="ans" value="'+i+'"><span>'+esc(v)+'</span></label>').join(""):""}
function answer(){if(!current||answered)return;let el=document.querySelector('input[name=ans]:checked');if(!el)return alert("請先選擇答案");let n=+el.value,ok=n===current.a,c=kid();answered=true;let r={kid:c.id,subject:current.s,q:current.q,choice:n,answer:current.a,correct:ok,explain:current.e,options:current.o,why:current.x[n]};data.records.push(r);if(!ok)data.wrong.push(r);save();$("feedback").className="feedback"+(ok?"":" bad");$("feedback").innerHTML=(ok?"<b>答對了！</b>":"<b>再想一想，這題答錯了。</b>")+"<br>正確答案："+esc(current.o[current.a])+"<br><b>觀念解析：</b>"+esc(current.e)+"<br><b>你的選項：</b>"+esc(current.x[n]);$("check").classList.add("hidden");$("next").classList.remove("hidden");document.querySelectorAll('input[name=ans]').forEach(x=>x.disabled=true)}
function stats(){let a=data.records.filter(r=>r.kid===$("kid").value),ok=a.filter(r=>r.correct).length;$("done").textContent=a.length;$("rate").textContent=a.length?Math.round(ok/a.length*100)+"%":"0%";$("wrongN").textContent=data.wrong.filter(r=>r.kid===$("kid").value).length;let m={};a.forEach(r=>{m[r.subject]??={n:0,c:0};m[r.subject].n++;if(r.correct)m[r.subject].c++});$("bySubject").innerHTML=Object.entries(m).map(([s,v])=>'<p>'+esc(s)+'：'+v.c+'/'+v.n+' 題答對（'+Math.round(v.c/v.n*100)+'%）</p>').join("")||'<p class="muted">完成練習後會顯示各科統計。</p>'}
function wrongList(){let a=data.wrong.filter(r=>r.kid===$("kid").value);$("wrongItems").innerHTML=a.length?a.slice().reverse().map(r=>'<div class="card"><b>'+esc(r.subject)+'｜'+esc(r.q)+'</b><p class="muted">你的答案：'+esc(r.options[r.choice])+'；正確答案：'+esc(r.options[r.answer])+'</p><p>'+esc(r.explain)+'</p></div>').join(""):"目前還沒有錯題。"}
function renderKids(){$("kid").innerHTML=data.kids.map(k=>'<option value="'+k.id+'">'+esc(k.name)+'</option>').join("");$("kids").innerHTML=data.kids.map(k=>'<div class="child"><span>'+esc(k.name)+'</span><button class="btn" onclick="renameKid(\''+k.id+'\')">改名</button><button class="btn danger" onclick="deleteKid(\''+k.id+'\')">刪除</button></div>').join("")}
function renameKid(id){let k=data.kids.find(x=>x.id===id),v=prompt("孩子暱稱",k.name);if(v&&v.trim()){k.name=v.trim();renderKids();save()}}
function deleteKid(id){if(data.kids.length<2)return alert("至少保留一位孩子");if(!confirm("刪除孩子及其學習紀錄？"))return;data.kids=data.kids.filter(k=>k.id!==id);data.records=data.records.filter(r=>r.kid!==id);data.wrong=data.wrong.filter(r=>r.kid!==id);renderKids();$("grade").value=kid().grade;fillSubjects();save()}
$("add").onclick=()=>{let n=$("newName").value.trim();if(!n)return alert("請輸入暱稱");data.kids.push({id:"k"+Date.now(),name:n,grade:"小一預備"});$("newName").value="";renderKids();$("kid").value=data.kids[data.kids.length-1].id;stats();wrongList()};
$("kid").onchange=()=>{$("grade").value=kid().grade||"小一預備";fillSubjects();stats();wrongList()};
$("grade").onchange=()=>{kid().grade=$("grade").value;save();fillSubjects()};
$("subject").onchange=loadQ;$("check").onclick=answer;$("next").onclick=loadQ;$("hint").onclick=()=>current&&alert("提示："+current.h);
$("print").onclick=()=>{let a=listQ();if(!a.length)return alert("目前沒有可列印的樣題");let w=window.open("","_blank");if(!w)return alert("請允許開啟列印視窗");w.document.write('<html lang="zh-Hant"><meta charset="utf-8"><title>練習題本</title><style>body{font-family:sans-serif;padding:28px;line-height:1.7}.q{margin:22px 0;break-inside:avoid}.answers{page-break-before:always}</style><h1>家庭智慧學習中心｜'+esc($("subject").value)+'練習題</h1><p>姓名：__________ 日期：__________</p>'+a.map((q,i)=>'<div class="q"><b>'+(i+1)+'. '+esc(q.q)+'</b><ol type="A">'+q.o.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol></div>').join("")+'<div class="answers"><h1>答案與解析</h1>'+a.map((q,i)=>'<div class="q"><b>'+(i+1)+'. '+esc(q.o[q.a])+'</b><p>'+esc(q.e)+'</p><p>提示：'+esc(q.h)+'</p></div>').join("")+'</div></html>');w.document.close();w.focus();w.print()};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));["learn","wrong","progress","family"].forEach(id=>$(id).classList.toggle("hidden",id!==b.dataset.tab));stats();wrongList();renderKids()});
renderKids();$("grade").value=kid().grade||"小一預備";fillSubjects();stats();wrongList();
</script></body></html>
